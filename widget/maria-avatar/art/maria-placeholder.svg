<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" width="320" height="560">
  <!-- ====================================================================
       MarIA de referencia (placeholder).
       Se dibuja como se dibujaría un frame del gif: las piezas que después
       se recortan (brazos, piernas, cabeza) están separadas del cuerpo y las
       mangas del vestido tapan la articulación del hombro. El orden de
       dibujo es el mismo que el z-index del rig.
       Reemplazable por el frame real: ver rigs/maria-placeholder.rig.json
       ==================================================================== -->
  <defs>
    <linearGradient id="ma-dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f0409f"/>
    </linearGradient>
    <linearGradient id="ma-dress-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6ef8"/>
      <stop offset="1" stop-color="#c752c8"/>
    </linearGradient>
  </defs>

  <!-- 1. cola de pelo (detrás de todo) -->
  <path d="M110 106 C 84 120 76 152 84 176 C 90 190 106 192 111 182 C 100 160 104 130 118 116 Z" fill="#2b2233"/>

  <!-- 2. pierna lejana -->
  <path d="M148 316 L141 410" stroke="#e0ab86" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M141 410 L137 488" stroke="#e0ab86" stroke-width="25" stroke-linecap="round" fill="none"/>
  <rect x="116" y="484" width="44" height="24" rx="10" fill="#3b2f4a"/>

  <!-- 3. pierna cercana -->
  <path d="M175 316 L180 412" stroke="#f7cfae" stroke-width="32" stroke-linecap="round" fill="none"/>
  <path d="M180 412 L183 490" stroke="#f7cfae" stroke-width="27" stroke-linecap="round" fill="none"/>
  <rect x="163" y="486" width="46" height="25" rx="10" fill="#2b2233"/>

  <!-- 4. brazo lejano -->
  <path d="M126 214 L106 272" stroke="#e0ab86" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M106 272 L98 330" stroke="#e0ab86" stroke-width="21" stroke-linecap="round" fill="none"/>
  <ellipse cx="96" cy="344" rx="13" ry="15" fill="#e0ab86"/>

  <!-- 5. cuello -->
  <rect x="149" y="150" width="22" height="56" rx="11" fill="#e5b590"/>

  <!-- 6. vestido + mangas (tapan el hombro para esconder la junta) -->
  <path d="M137 196 C 140 240 141 250 141 264 L 116 336 C 132 350 188 350 204 336 L 179 264 C 179 250 180 240 183 196 Z" fill="url(#ma-dress)"/>
  <ellipse cx="134" cy="206" rx="21" ry="15" fill="url(#ma-dress-2)"/>
  <ellipse cx="188" cy="206" rx="21" ry="15" fill="url(#ma-dress-2)"/>
  <path d="M139 197 C 148 210 172 210 181 197 C 168 194 152 194 139 197 Z" fill="#ffffff" opacity=".2"/>
  <path d="M141 264 L179 264" stroke="#ffffff" stroke-width="5" opacity=".18" stroke-linecap="round"/>

  <!-- 7. brazo cercano -->
  <path d="M196 214 L216 274" stroke="#f7cfae" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M216 274 L224 332" stroke="#f7cfae" stroke-width="21" stroke-linecap="round" fill="none"/>
  <ellipse cx="226" cy="346" rx="13" ry="15" fill="#f7cfae"/>

  <!-- 8. cabeza -->
  <ellipse cx="160" cy="112" rx="56" ry="58" fill="#2b2233"/>
  <ellipse cx="119" cy="130" rx="7" ry="9" fill="#e5b590"/>
  <ellipse cx="201" cy="130" rx="7" ry="9" fill="#e5b590"/>
  <ellipse cx="160" cy="124" rx="42" ry="46" fill="#f7cfae"/>
  <path d="M118 116 C 118 76 202 76 202 116 C 194 98 182 92 168 97 C 150 103 130 106 118 116 Z" fill="#2b2233"/>
  <ellipse cx="134" cy="142" rx="8" ry="5" fill="#ef8fa0" opacity=".45"/>
  <ellipse cx="186" cy="142" rx="8" ry="5" fill="#ef8fa0" opacity=".45"/>
  <ellipse cx="146" cy="124" rx="5.5" ry="7" fill="#2b2233"/>
  <ellipse cx="174" cy="124" rx="5.5" ry="7" fill="#2b2233"/>
  <circle cx="148" cy="121" r="2" fill="#ffffff"/>
  <circle cx="176" cy="121" r="2" fill="#ffffff"/>
  <path d="M138 110 C 142 105 150 105 154 109" stroke="#2b2233" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M166 109 C 170 105 178 105 182 110" stroke="#2b2233" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M151 145 C 156 151 164 151 169 145" stroke="#8a4a5a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
